[package]
name        = "kastellan-worker-python-exec"
description = "Tool worker: run agent-authored Python (stdlib only) in a no-net, scratch-only jail."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "../../README.md"

[lib]
name = "kastellan_worker_python_exec"
path = "src/lib.rs"

[[bin]]
name = "kastellan-worker-python-exec"
path = "src/main.rs"

[dependencies]
# setsid/kill for process-group reaping of the interpreter (audit 2026-09-02, F5).
libc = { workspace = true }
kastellan-protocol       = { path = "../../protocol", version = "0.2.0" }
kastellan-worker-prelude = { path = "../prelude", version = "0.2.0" }
serde                  = { workspace = true }
serde_json             = { workspace = true }
anyhow                 = { workspace = true }

[dev-dependencies]
# Test-only: the signal-death tests name signals by constant rather than by
# number. SIGKILL agrees across our two first-class platforms but SIGSYS does
# not (31 on Linux, 12 on macOS), so a literal would be wrong on exactly one
# gate host — and using libc uniformly means no test has to know which is which.
