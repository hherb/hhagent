[project]
name = "kastellan-worker-gliner-relex"
version = "0.0.1"
description = "GLiNER-Relex inference worker for kastellan (Apache 2.0 model; JSON-RPC stdio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "kastellan contributors" }]
dependencies = [
    # GLiNER pulls the upstream `gliner` library (Apache 2.0). The
    # Knowledgator gliner-relex-* model weights load via this same lib;
    # no separate inference framework needed.
    #
    # The two floors below are COUPLED, and both are load-bearing:
    #
    #   * `transformers>=5.10.0` is the security floor. Everything below it
    #     carries GHSA-xrqw-3rrv-vx5w (high) — a `save_pretrained` path
    #     traversal that lets a crafted chat-template name write to an
    #     arbitrary path. First patched in 5.10.0. We declare it here rather
    #     than only bumping `uv.lock`, so the vulnerable range is
    #     *unsatisfiable* rather than merely unlocked.
    #
    #   * `gliner>=0.2.28` is what makes that floor reachable. `gliner`
    #     0.2.27 declares `transformers<5.7.0`, so with it in the graph the
    #     best `uv lock --upgrade-package transformers` can do is 5.6.2 —
    #     still vulnerable, and it exits 0 while saying so. 0.2.28 raised the
    #     cap to `<5.14.0`. Bumping `transformers` alone does NOT fix the
    #     advisory; see issue #649.
    #
    # Consequence worth keeping: with both floors declared, a resolution that
    # tries to hold `gliner` at 0.2.27 is now a hard conflict rather than a
    # silent downgrade.
    "gliner>=0.2.28",
    "transformers>=5.10.0",
    "sentencepiece>=0.2",
    # Torch is implicit via transformers, but pin it explicitly so an
    # accidental wheel-resolution surprise (CUDA version mismatch) is
    # caught at uv sync time rather than at model load.
    "torch>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[project.scripts]
# uv generates an executable shim at .venv/bin/kastellan-worker-gliner-relex
# equivalent to: python -m kastellan_worker_gliner_relex
# The manifest's `binary: PathBuf` field points at this shim — keeps
# the existing ToolEntry schema unchanged (no `args` field needed).
kastellan-worker-gliner-relex = "kastellan_worker_gliner_relex.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kastellan_worker_gliner_relex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
