# Hash-pinned dependency lock for the browser-driver worker's HOST install path
# (scripts/workers/browser-driver/install.sh) and the micro-VM rootfs image
# (scripts/workers/microvm/Dockerfile.browser-driver).
#
# Why this exists (security audit 2026-09-02): pyproject.toml declares only
# `>=` floors, and the host installer used to `pip install` straight from it,
# so every operator install resolved whatever PyPI served that day — an
# unpinned, unverified dependency set inside a containment boundary, and one
# that could differ from the (separately hand-pinned) VM rootfs. Every
# distribution file below is pinned by version AND sha256, and both install
# paths pass `--require-hashes`, so a substituted wheel fails the install.
#
# Regenerate deliberately (never by hand), then review the diff:
#
#   cd workers/browser-driver
#   uv pip compile pyproject.toml --python-version 3.11 --generate-hashes \
#       --no-annotate -o requirements.lock
#
# `--python-version 3.11` matches `requires-python`; uv records the hashes of
# every wheel + sdist of each pinned version, so one lock serves both
# first-class hosts (Linux aarch64/x86_64, macOS arm64).
